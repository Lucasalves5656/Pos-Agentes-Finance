<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Telegram - FinanceControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mobile-optimization.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-item { transition: all 0.3s ease; }
        .sidebar-item:hover { transform: translateX(4px); }
        .chat-container { height: calc(100vh - 250px); }
        .message-in { background-color: #f3f4f6; border-bottom-left-radius: 0; }
        .message-out { background-color: #3b82f6; color: white; border-bottom-right-radius: 0; }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar w-64 bg-white shadow-lg h-screen fixed left-0 top-0 z-30 md:relative md:z-auto">
        <div class="p-6 h-full flex flex-col">
            <div class="flex-shrink-0 flex items-center mb-8">
                <i class="fas fa-chart-line text-2xl text-blue-600 mr-3"></i>
                <span class="text-xl font-bold text-gray-900">FinanceControl</span>
            </div>
            <nav class="space-y-2 flex-grow overflow-y-auto">
                <a href="index.html" class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    <span>Dashboard</span>
                </a>
                <a href="clientes.html" class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-users mr-3"></i>
                    <span>Clientes</span>
                </a>
                <a href="telegram.html" class="sidebar-item flex items-center px-4 py-3 text-blue-600 bg-blue-50 rounded-lg">
                    <i class="fab fa-telegram-plane mr-3"></i>
                    <span class="font-medium">Telegram Chat</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col pt-4 px-4 md:px-8 overflow-hidden h-screen">
        <!-- Header -->
        <div class="mb-4 flex items-center justify-between flex-shrink-0">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 mb-1">Telegram Chat</h1>
                <p class="text-gray-600 text-sm">Integração direta com o bot: Nenhuma base de dados externa utilizada.</p>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 bg-white rounded-xl shadow-md flex flex-col overflow-hidden mb-6 relative">
            <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4 bg-gray-50">
                <!-- Mensagens aparecerão aqui -->
                <div class="flex justify-center text-xs text-gray-400 my-2">Início da conversa com o Bot</div>
            </div>

            <!-- Input Area -->
            <div class="border-t p-4 bg-white flex items-center">
                <input type="text" id="chat-input" class="flex-1 border-gray-300 border rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Digite uma mensagem para o Telegram...">
                <button id="send-btn" class="ml-3 bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-blue-700 transition">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
    <script>
        let lastUpdateId = parseInt(localStorage.getItem('tg_last_update_id')) || 0;
        let lastChatId = localStorage.getItem('tg_last_chat_id') || null;
        
        // Estrutura das mensagens em localStorage
        let messages = JSON.parse(localStorage.getItem('tg_messages')) || [];

        const chatContainer = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function saveState() {
            localStorage.setItem('tg_last_update_id', lastUpdateId);
            if(lastChatId) localStorage.setItem('tg_last_chat_id', lastChatId);
            localStorage.setItem('tg_messages', JSON.stringify(messages));
        }

        function renderMessages() {
            chatContainer.innerHTML = '<div class="flex justify-center text-xs text-gray-400 my-2">Início da conversa com o Bot</div>';
            messages.forEach(msg => {
                appendMessageToDOM(msg);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessageToDOM(msg) {
            const div = document.createElement('div');
            if(msg.type === 'in') {
                div.className = 'flex items-start';
                div.innerHTML = `
                    <div class="h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold mr-2 flex-shrink-0">
                        <i class="fab fa-telegram-plane"></i>
                    </div>
                    <div class="message-in py-2 px-4 rounded-xl max-w-[70%] shadow-sm">
                        <div class="text-xs text-blue-500 font-semibold mb-1">${msg.sender || 'Usuário Telegram'}</div>
                        <p class="text-sm text-gray-800">${msg.text}</p>
                        <span class="text-[10px] text-gray-400 mt-1 block">${new Date(msg.time).toLocaleTimeString()}</span>
                    </div>
                `;
            } else {
                div.className = 'flex items-end justify-end';
                div.innerHTML = `
                    <div class="message-out py-2 px-4 rounded-xl max-w-[70%] shadow-sm mr-2 text-right">
                        <p class="text-sm">${msg.text}</p>
                        <span class="text-[10px] text-blue-200 mt-1 block">${new Date(msg.time).toLocaleTimeString()}</span>
                    </div>
                    <div class="h-8 w-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 font-bold flex-shrink-0">
                        <i class="fas fa-user"></i>
                    </div>
                `;
            }
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function askAIAndReply(userMessage, chatId) {
            try {
                // Chama a nossa API na Vercel (que carrega o .env seguro)
                const res = await fetch('/api/mistral', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage, chatId: chatId })
                });
                
                if(!res.ok) throw new Error("Erro na Vercel/API");
                
                const data = await res.json();
                
                if (data.blocked) {
                    console.warn(data.error);
                    return; // IA está proibida de responder
                }
                
                if(data.reply) {
                    // IA respondeu, agora enviamos devolver a mensagem pro Telegram
                    await sendTelegramMsg(data.reply, chatId, 'IA Mistral');
                }
            } catch (error) {
                console.error("Erro ao chamar IA:", error);
                await sendTelegramMsg("*(Erro de conexão com a IA)*", chatId, 'Sistema');
            }
        }

        async function sendTelegramMsg(text, chatId, senderName = '') {
            const newMsg = { id: Date.now(), type: 'out', text: text, time: new Date().getTime(), sender: senderName };
            messages.push(newMsg);
            appendMessageToDOM(newMsg);
            saveState();

            try {
                await fetch('/api/telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text
                    })
                });
            } catch (error) {
                console.error("Erro ao enviar mensagem:", error);
            }
        }

        let isFetching = false;

        async function fetchUpdates() {
            if (isFetching) return;
            isFetching = true;

            try {
                const url = `/api/telegram?offset=${lastUpdateId + 1}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.ok && data.result.length > 0) {
                    for (const update of data.result) {
                        if (update.update_id > lastUpdateId) {
                            lastUpdateId = update.update_id;
                            saveState(); // Salva o offset antes de processar, pra evitar receber 2x
                            
                            if (update.message && update.message.text) {
                                lastChatId = update.message.chat.id;
                                const newMsg = {
                                    id: update.message.message_id,
                                    type: 'in',
                                    text: update.message.text,
                                    sender: update.message.from.first_name,
                                    time: new Date().getTime()
                                };
                                messages.push(newMsg);
                                appendMessageToDOM(newMsg);
                                saveState();
                                
                                // Aciona a IA para responder à mensagem recebida SOMENTE UMA VEZ
                                await askAIAndReply(newMsg.text, lastChatId);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("Erro ao buscar atualizações do Telegram:", error);
            } finally {
                isFetching = false;
            }
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if(!text) return;
            
            if(!lastChatId) {
                alert("Nenhum usuário iniciou conversa no Telegram ainda! O bot precisa receber uma mensagem primeiro para saber para quem responder.");
                return;
            }

            chatInput.value = '';
            
            // Enviado manualmente pelo painel
            await sendTelegramMsg(text, lastChatId, 'Você (Painel)');
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMessage();
        });

        // Loop de verificação de mensagens configurado com trava (mutex flag)
        setInterval(fetchUpdates, 3000);

        // Inicializar UI
        renderMessages();
        fetchUpdates();

    </script>
</body>
</html>
