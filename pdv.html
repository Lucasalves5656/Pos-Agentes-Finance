<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - FinanceControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Adicione as importações do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-item { transition: all 0.3s ease; }
        .sidebar-item:hover { transform: translateX(4px); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .animate-fade-in { animation: fadeIn 0.6s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .product-card { transition: all 0.3s ease; cursor: pointer; }
        .product-card:hover { transform: scale(1.02); }
        .cart-item { transition: all 0.3s ease; }
        .quantity-btn { transition: all 0.2s ease; }
        .quantity-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-chart-line text-2xl text-blue-600 mr-3"></i>
                        <span class="text-xl font-bold text-gray-900">FinanceControl</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="clearCart()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors">
                        <i class="fas fa-trash mr-2"></i>Limpar
                    </button>
                    <div class="relative">
                        <button class="text-gray-600 hover:text-gray-900">
                            <i class="fas fa-bell text-xl"></i>
                        </button>
                    </div>
                    <div class="relative">
                        <button class="flex items-center text-gray-700 hover:text-gray-900">
                            <div
                                class="h-8 w-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold mr-2">
                                A
                            </div>
                            <span>Admin</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

<!-- Main Content -->
    <div class="pt-16 flex">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar w-64 bg-white shadow-lg h-screen fixed left-0 top-16 z-30 md:z-auto">
            <div class="p-6">
                <nav class="space-y-2">
                    <a href="index.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-tachometer-alt mr-3"></i>
                        <span class="font-medium">Dashboard</span>
                    </a>
                    <a href="clientes.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-users mr-3"></i>
                        <span>Clientes</span>
                    </a>
                    <a href="fornecedores.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-truck mr-3"></i>
                        <span>Fornecedores</span>
                    </a>
                    <a href="produtos.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-box mr-3"></i>
                        <span>Produtos</span>
                    </a>
                    <a href="funcionarios.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-user-tie mr-3"></i>
                        <span>Funcionários</span>
                    </a>
                    <a href="teste.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-vial mr-3 text-purple-500"></i>
                        <span>Teste de Função</span>
                    </a>
                    <div class="border-t pt-4 mt-4">
                        <a href="pdv.html"
                            class="sidebar-item flex items-center px-4 py-3 text-green-600 bg-blue-50 rounded-lg">
                            <i class="fas fa-cash-register mr-3"></i>
                            <span class="font-medium">PDV</span>
                        </a>
                        <a href="vendas.html"
                            class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                            <i class="fas fa-shopping-cart mr-3"></i>
                            <span>Vendas</span>
                        </a>
                        <a href="gastos.html"
                            class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                            <i class="fas fa-receipt mr-3"></i>
                            <span>Gastos</span>
                        </a>
                        <a href="financeiro.html"
                            class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                            <i class="fas fa-chart-bar mr-3"></i>
                            <span>Financeiro</span>
                        </a>
                    </div>
                </nav>
            </div>
        </div>


        <!-- Content Area -->
        <div class="flex-1 ml-64 p-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Products Section -->
                <div class="lg:col-span-2">
                    <!-- Header -->
                    <div class="mb-8 animate-fade-in">
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">Ponto de Venda</h1>
                        <p class="text-gray-600">Selecione os produtos para venda</p>
                    </div>

                    <!-- Search -->
                    <div class="bg-white p-4 rounded-xl shadow-md mb-6 animate-fade-in">
                        <div class="relative">
                            <input type="text" id="productSearch" placeholder="Pesquisar produtos..." 
                                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        </div>
                    </div>

                    <!-- Products Grid -->
                    <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 animate-fade-in">
                        <!-- Produtos serão carregados dinamicamente -->
                        <div class="text-center py-8 text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>Carregando produtos...</p>
                        </div>
                    </div>
                </div>

                <!-- Cart Section -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-xl shadow-md p-6 sticky top-24 animate-fade-in">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-shopping-cart mr-2"></i>Carrinho
                        </h3>
                        
                        <!-- Cart Items -->
                        <div id="cartItems" class="space-y-3 mb-6 max-h-96 overflow-y-auto">
                            <div class="text-center text-gray-500 py-8">
                                <i class="fas fa-shopping-cart text-4xl mb-2"></i>
                                <p>Carrinho vazio</p>
                            </div>
                        </div>

                        <!-- Cart Summary -->
                        <div class="border-t pt-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-gray-600">Subtotal:</span>
                                <span id="subtotal" class="font-semibold">R$ 0.00</span>
                            </div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-gray-600">Desconto:</span>
                                <input type="number" id="discount" value="0" min="0" max="100" class="w-16 px-2 py-1 border rounded text-center" onchange="updateTotal()"> %
                            </div>
                            <div class="flex justify-between items-center text-lg font-bold border-t pt-2">
                                <span>Total:</span>
                                <span id="total" class="text-green-600">R$ 0.00</span>
                            </div>
                        </div>

                        <!-- Customer Selection -->
                        <div class="mt-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Cliente</label>
                            <select id="customer" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <option value="">Selecione um cliente</option>
                                <!-- Clientes serão carregados dinamicamente -->
                            </select>
                        </div>

                        <!-- Payment Method -->
                        <div class="mt-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Forma de Pagamento</label>
                            <select id="paymentMethod" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <option value="Dinheiro">Dinheiro</option>
                                <option value="Cartão de Crédito">Cartão de Crédito</option>
                                <option value="Cartão de Débito">Cartão de Débito</option>
                                <option value="PIX">PIX</option>
                            </select>
                        </div>

                        <!-- Notes -->
                        <div class="mt-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Observações</label>
                            <textarea id="notes" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Observações da venda..."></textarea>
                        </div>

                        <!-- Action Buttons -->
                        <div class="mt-6 space-y-3">
                            <button onclick="finalizeSale()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition-colors font-semibold">
                                <i class="fas fa-check mr-2"></i>Finalizar Venda
                            </button>
                            <button onclick="saveQuote()" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors">
                                <i class="fas fa-save mr-2"></i>Salvar Orçamento
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let products = [];
        let clients = [];

        // Carregar produtos e clientes quando a página for carregada
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            loadClients();
            
            // Animate elements on load
            anime({
                targets: '.animate-fade-in',
                opacity: [0, 1],
                translateY: [20, 0],
                delay: anime.stagger(100),
                duration: 600,
                easing: 'easeOutQuad'
            });
        });

        // Carregar produtos do banco de dados
        async function loadProducts() {
            try {
                products = await FinanceControlDB.getProducts();
                renderProducts();
            } catch (error) {
                console.error('Erro ao carregar produtos:', error);
                document.getElementById('productsGrid').innerHTML = `
                    <div class="text-center py-8 text-red-500">
                        <i class="fas fa-exclamation-triangle text-2xl mb-2"></i>
                        <p>Erro ao carregar produtos</p>
                    </div>
                `;
            }
        }

        // Carregar clientes do banco de dados
        async function loadClients() {
            try {
                clients = await FinanceControlDB.getClients();
                renderClients();
            } catch (error) {
                console.error('Erro ao carregar clientes:', error);
            }
        }

        // Renderizar produtos na tela
        function renderProducts() {
            const productsGrid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                productsGrid.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-box-open text-2xl mb-2"></i>
                        <p>Nenhum produto cadastrado</p>
                    </div>
                `;
                return;
            }

            productsGrid.innerHTML = products
                .filter(product => product.status === 'active')
                .map(product => `
                    <div class="product-card bg-white p-4 rounded-xl shadow-md" onclick="addToCart('${product.id}', '${product.name}', ${product.price}, 1)">
                        <div class="w-full h-32 bg-gray-100 rounded-lg flex items-center justify-center mb-3">
                            <i class="fas fa-${getProductIcon(product.category)} text-4xl text-gray-600"></i>
                        </div>
                        <h3 class="font-semibold text-gray-900 mb-1">${product.name}</h3>
                        <p class="text-sm text-gray-500 mb-2">Código: ${product.code}</p>
                        <p class="text-lg font-bold text-green-600">R$ ${product.price.toFixed(2)}</p>
                        <p class="text-sm ${product.stock_quantity <= product.min_stock ? 'text-red-500' : 'text-gray-500'}">
                            Estoque: ${product.stock_quantity}
                        </p>
                    </div>
                `).join('');
        }

        // Renderizar clientes no dropdown
        function renderClients() {
            const customerSelect = document.getElementById('customer');
            
            if (clients.length === 0) {
                customerSelect.innerHTML = '<option value="">Nenhum cliente cadastrado</option>';
                return;
            }

            customerSelect.innerHTML = '<option value="">Selecione um cliente</option>' +
                clients
                    .filter(client => client.status === 'active')
                    .map(client => `<option value="${client.id}">${client.name}</option>`)
                    .join('');
        }

        // Obter ícone baseado na categoria do produto
        function getProductIcon(category) {
            const icons = {
                'Eletrônicos': 'laptop',
                'Alimentos': 'cookie-bite',
                'Vestuário': 'tshirt',
                'Tecnologia': 'microchip',
                'Escritório': 'pencil-alt'
            };
            
            return icons[category] || 'box';
        }

        // Add product to cart
        function addToCart(productId, name, price, quantity) {
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({
                    id: productId,
                    name: name,
                    price: price,
                    quantity: quantity
                });
            }
            
            updateCartDisplay();
            
            // Animate cart update
            anime({
                targets: '#cartItems',
                scale: [0.95, 1],
                duration: 200,
                easing: 'easeOutQuad'
            });
        }

        // Remove item from cart
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        // Update quantity
        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                removeFromCart(index);
            } else {
                updateCartDisplay();
            }
        }

        // Update cart display
        function updateCartDisplay() {
            const cartItems = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="text-center text-gray-500 py-8">
                        <i class="fas fa-shopping-cart text-4xl mb-2"></i>
                        <p>Carrinho vazio</p>
                    </div>
                `;
            } else {
                cartItems.innerHTML = cart.map((item, index) => `
                    <div class="cart-item flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div class="flex-1">
                            <h4 class="font-medium text-gray-900 text-sm">${item.name}</h4>
                            <p class="text-xs text-gray-500">R$ ${item.price.toFixed(2)}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="quantity-btn w-6 h-6 bg-gray-200 rounded-full flex items-center justify-center text-xs" onclick="updateQuantity(${index}, -1)">-</button>
                            <span class="text-sm font-medium">${item.quantity}</span>
                            <button class="quantity-btn w-6 h-6 bg-gray-200 rounded-full flex items-center justify-center text-xs" onclick="updateQuantity(${index}, 1)">+</button>
                            <button class="text-red-600 hover:text-red-800 ml-2" onclick="removeFromCart(${index})">
                                <i class="fas fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            
            updateTotal();
        }

        // Update total
        function updateTotal() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const discount = parseFloat(document.getElementById('discount').value) || 0;
            const discountAmount = subtotal * (discount / 100);
            const total = subtotal - discountAmount;
            
            document.getElementById('subtotal').textContent = `R$ ${subtotal.toFixed(2)}`;
            document.getElementById('total').textContent = `R$ ${total.toFixed(2)}`;
        }

        // Clear cart
        function clearCart() {
            if (cart.length > 0 && confirm('Deseja realmente limpar o carrinho?')) {
                cart = [];
                updateCartDisplay();
                document.getElementById('customer').value = '';
                document.getElementById('paymentMethod').value = 'Dinheiro';
                document.getElementById('notes').value = '';
                document.getElementById('discount').value = '0';
            }
        }

        // Finalize sale
        async function finalizeSale() {
            if (cart.length === 0) {
                alert('Adicione produtos ao carrinho antes de finalizar a venda.');
                return;
            }
            
            const clientId = document.getElementById('customer').value;
            if (!clientId) {
                alert('Selecione um cliente para finalizar a venda.');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const discount = parseFloat(document.getElementById('discount').value) || 0;
            const finalTotal = total - (total * (discount / 100));
            const paymentMethod = document.getElementById('paymentMethod').value;
            const notes = document.getElementById('notes').value;
            
            if (confirm(`Confirmar venda de R$ ${finalTotal.toFixed(2)}?`)) {
                try {
                    // Criar a venda no banco de dados
                    const { data: sale, error } = await supabaseClient
                        .from('sales')
                        .insert([{
                            client_id: clientId,
                            total_amount: finalTotal,
                            discount: discount,
                            payment_method: paymentMethod,
                            status: 'completed',
                            notes: notes
                        }])
                        .select()
                        .single();

                    if (error) throw error;

                    // Adicionar os itens da venda
                    for (const item of cart) {
                        const { error: itemError } = await supabaseClient
                            .from('sale_items')
                            .insert([{
                                sale_id: sale.id,
                                product_id: item.id,
                                quantity: item.quantity,
                                unit_price: item.price,
                                total_price: item.price * item.quantity
                            }]);

                        if (itemError) throw itemError;
                    }

                    alert('Venda realizada com sucesso!');
                    clearCart();
                    
                    // Recarregar produtos para atualizar estoque
                    loadProducts();
                    
                } catch (error) {
                    console.error('Erro ao finalizar venda:', error);
                    alert('Erro ao finalizar venda: ' + error.message);
                }
            }
        }

        // Save quote
        function saveQuote() {
            if (cart.length === 0) {
                alert('Adicione produtos ao carrinho antes de salvar o orçamento.');
                return;
            }
            
            // Aqui você implementaria a lógica para salvar um orçamento
            // Por enquanto, apenas uma mensagem de sucesso
            alert('Orçamento salvo com sucesso!');
        }

        // Product search
        document.getElementById('productSearch').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const productCards = document.querySelectorAll('.product-card');
            
            productCards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
<script>
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
