<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários - FinanceControl</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .sidebar-item {
            transition: all 0.3s ease;
        }

        .sidebar-item:hover {
            transform: translateX(4px);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal {
            display: none;
        }

        .modal.active {
            display: flex;
        }

        .status-active {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-inactive {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .status-vacation {
            background-color: #fef3c7;
            color: #92400e;
        }
    </style>
</head>

<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-chart-line text-2xl text-blue-600 mr-3"></i>
                        <span class="text-xl font-bold text-gray-900">FinanceControl</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="openModal()"
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        <i class="fas fa-plus mr-2"></i>Novo Funcionário
                    </button>
                    <div class="relative">
                        <button class="text-gray-600 hover:text-gray-900">
                            <i class="fas fa-bell text-xl"></i>
                        </button>
                    </div>
                    <div class="relative">
                        <button class="flex items-center text-gray-700 hover:text-gray-900">
                            <div
                                class="h-8 w-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold mr-2">
                                A
                            </div>
                            <span>Admin</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="pt-16 flex">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar w-64 bg-white shadow-lg h-screen fixed left-0 top-16 z-30 md:z-auto">
            <div class="p-6">
                <nav class="space-y-2">
                    <a href="index.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-tachometer-alt mr-3"></i>
                        <span class="font-medium">Dashboard</span>
                    </a>
                    <a href="clientes.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-users mr-3"></i>
                        <span>Clientes</span>
                    </a>
                    <a href="fornecedores.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-truck mr-3"></i>
                        <span>Fornecedores</span>
                    </a>
                    <a href="produtos.html"
                        class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-box mr-3"></i>
                        <span>Produtos</span>
                    </a>
                    <a href="funcionarios.html"
                        class="sidebar-item flex items-center px-4 py-3 text-blue-600 bg-blue-50 rounded-lg">
                        <i class="fas fa-user-tie mr-3"></i>
                        <span>Funcionários</span>
                    </a>
                    <div class="border-t pt-4 mt-4">
                        <a href="pdv.html"
                            class="sidebar-item flex items-center px-4 py-3 text-green-600 hover:bg-green-50 rounded-lg">
                            <i class="fas fa-cash-register mr-3"></i>
                            <span class="font-medium">PDV</span>
                        </a>
                        <a href="vendas.html"
                            class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                            <i class="fas fa-shopping-cart mr-3"></i>
                            <span>Vendas</span>
                        </a>
                        <a href="gastos.html"
                            class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                            <i class="fas fa-receipt mr-3"></i>
                            <span>Gastos</span>
                        </a>
                        <a href="financeiro.html"
                            class="sidebar-item flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                            <i class="fas fa-chart-bar mr-3"></i>
                            <span>Financeiro</span>
                        </a>
                    </div>
                </nav>
            </div>
        </div>


        <!-- Content Area -->
        <div class="flex-1 ml-64 p-8">
            <!-- Header -->
            <div class="mb-8 animate-fade-in">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Funcionários</h1>
                <p class="text-gray-600">Gerencie sua equipe de colaboradores</p>
            </div>

            <!-- Search and Filter -->
            <div class="bg-white p-6 rounded-xl shadow-md mb-6 animate-fade-in">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <div class="relative">
                            <input type="text" id="searchInput" placeholder="Pesquisar funcionários..."
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <select id="positionFilter"
                            class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Todos cargos</option>
                            <option value="Gerente">Gerente</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Caixa">Caixa</option>
                            <option value="Estagiário">Estagiário</option>
                        </select>
                        <select id="statusFilter"
                            class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Todos status</option>
                            <option value="active">Ativo</option>
                            <option value="inactive">Inativo</option>
                            <option value="vacation">Férias</option>
                        </select>
                        <button id="filterButton"
                            class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                            <i class="fas fa-filter mr-2"></i>Filtrar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Employees Table -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden animate-fade-in">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900">Lista de Funcionários</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Funcionário</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Cargo</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Departamento</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Telefone</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Status</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Ações</th>
                            </tr>
                        </thead>
                        <tbody id="employeesTable" class="bg-white divide-y divide-gray-200">
                            <!-- Os dados serão carregados dinamicamente via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Adicionar/Editar Funcionário -->
    <div id="employeeModal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-4">
            <div class="px-6 py-4 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h3 id="modalTitle" class="text-lg font-semibold text-gray-900">Novo Funcionário</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <form id="employeeForm" class="p-6">
                <input type="hidden" id="employeeId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                        <input type="text" id="employeeName" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="employeeEmail" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                        <input type="tel" id="employeePhone" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cargo</label>
                        <select id="employeePosition" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Selecione um cargo</option>
                            <option value="Gerente">Gerente</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Caixa">Caixa</option>
                            <option value="Estagiário">Estagiário</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Departamento</label>
                        <select id="employeeDepartment" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Selecione um departamento</option>
                            <option value="Administração">Administração</option>
                            <option value="Vendas">Vendas</option>
                            <option value="Financeiro">Financeiro</option>
                            <option value="Operações">Operações</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Salário</label>
                        <input type="number" step="0.01" id="employeeSalary"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Data de Admissão</label>
                        <input type="date" id="employeeHireDate"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select id="employeeStatus" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="active">Ativo</option>
                            <option value="inactive">Inativo</option>
                            <option value="vacation">Férias</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal()"
                        class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="supabase-config.js"></script>
    <script>
        // Variáveis globais
        let employees = [];
        let currentEditingId = null;

        // Animate elements on load
        anime({
            targets: '.animate-fade-in',
            opacity: [0, 1],
            translateY: [20, 0],
            delay: anime.stagger(100),
            duration: 600,
            easing: 'easeOutQuad'
        });

        // Modal functions
        function openModal(employeeId = null) {
            const modal = document.getElementById('employeeModal');
            const title = document.getElementById('modalTitle');

            if (employeeId) {
                title.textContent = 'Editar Funcionário';
                currentEditingId = employeeId;
                fillFormWithEmployeeData(employeeId);
            } else {
                title.textContent = 'Novo Funcionário';
                currentEditingId = null;
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('employeeModal').classList.remove('active');
            document.getElementById('employeeForm').reset();
            currentEditingId = null;
        }

        // Preencher formulário com dados do funcionário para edição
        function fillFormWithEmployeeData(employeeId) {
            const employee = employees.find(emp => emp.id === employeeId);
            if (employee) {
                document.getElementById('employeeId').value = employee.id;
                document.getElementById('employeeName').value = employee.name || '';
                document.getElementById('employeeEmail').value = employee.email || '';
                document.getElementById('employeePhone').value = employee.phone || '';
                document.getElementById('employeePosition').value = employee.position || '';
                document.getElementById('employeeDepartment').value = employee.department || '';
                document.getElementById('employeeSalary').value = employee.salary || '';
                document.getElementById('employeeHireDate').value = employee.hire_date || '';
                document.getElementById('employeeStatus').value = employee.status || 'active';
            }
        }

        // Form submission
        document.getElementById('employeeForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const employeeData = {
                name: document.getElementById('employeeName').value,
                email: document.getElementById('employeeEmail').value,
                phone: document.getElementById('employeePhone').value,
                position: document.getElementById('employeePosition').value,
                department: document.getElementById('employeeDepartment').value,
                salary: document.getElementById('employeeSalary').value ? parseFloat(document.getElementById('employeeSalary').value) : null,
                hire_date: document.getElementById('employeeHireDate').value || null,
                status: document.getElementById('employeeStatus').value
            };

            try {
                if (currentEditingId) {
                    // Atualizar funcionário existente
                    await updateEmployee(currentEditingId, employeeData);
                    alert('Funcionário atualizado com sucesso!');
                } else {
                    // Criar novo funcionário
                    await FinanceControlDB.createEmployee(employeeData);
                    alert('Funcionário cadastrado com sucesso!');
                }

                closeModal();
                loadEmployees(); // Recarregar a lista
            } catch (error) {
                alert('Erro ao salvar funcionário: ' + error.message);
            }
        });

        // Função para atualizar funcionário
        async function updateEmployee(id, employeeData) {
            try {
                const { data, error } = await supabaseClient
                    .from('employees')
                    .update(employeeData)
                    .eq('id', id)
                    .select()
                    .single();

                if (error) throw error;
                return data;
            } catch (error) {
                console.error('Erro ao atualizar funcionário:', error);
                throw error;
            }
        }

        // Função para excluir funcionário
        async function deleteEmployee(id) {
            if (confirm('Tem certeza que deseja excluir este funcionário?')) {
                try {
                    const { error } = await supabaseClient
                        .from('employees')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;

                    alert('Funcionário excluído com sucesso!');
                    loadEmployees(); // Recarregar a lista
                } catch (error) {
                    alert('Erro ao excluir funcionário: ' + error.message);
                }
            }
        }

        // Função para carregar funcionários
        async function loadEmployees() {
            try {
                employees = await FinanceControlDB.getEmployees();
                renderEmployeesTable(employees);
            } catch (error) {
                console.error('Erro ao carregar funcionários:', error);
            }
        }

        // Função para renderizar a tabela de funcionários
        function renderEmployeesTable(employeesList) {
            const tableBody = document.getElementById('employeesTable');
            tableBody.innerHTML = '';

            if (employeesList.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-4 text-center text-gray-500">
                            Nenhum funcionário encontrado
                        </td>
                    </tr>
                `;
                return;
            }

            employeesList.forEach(employee => {
                const initials = getInitials(employee.name);
                const statusClass = getStatusClass(employee.status);
                const statusText = getStatusText(employee.status);

                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                                <span class="text-blue-600 font-medium">${initials}</span>
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">${employee.name}</div>
                                <div class="text-sm text-gray-500">${employee.email}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${employee.position}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${employee.department}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${employee.phone}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">
                            ${statusText}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="openModal('${employee.id}')" class="text-blue-600 hover:text-blue-900 mr-3">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteEmployee('${employee.id}')" class="text-red-600 hover:text-red-900">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Funções auxiliares
        function getInitials(name) {
            return name.split(' ').map(word => word[0]).join('').toUpperCase().substring(0, 2);
        }

        function getStatusClass(status) {
            switch (status) {
                case 'active': return 'status-active';
                case 'inactive': return 'status-inactive';
                case 'vacation': return 'status-vacation';
                default: return 'status-active';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'active': return 'Ativo';
                case 'inactive': return 'Inativo';
                case 'vacation': return 'Férias';
                default: return status;
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function (e) {
            const searchTerm = e.target.value.toLowerCase();
            filterEmployees();
        });

        // Filter functionality
        document.getElementById('filterButton').addEventListener('click', function () {
            filterEmployees();
        });

        // Função para filtrar funcionários
        function filterEmployees() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const positionFilter = document.getElementById('positionFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            let filteredEmployees = employees;

            if (searchTerm) {
                filteredEmployees = filteredEmployees.filter(employee =>
                    employee.name.toLowerCase().includes(searchTerm) ||
                    employee.email.toLowerCase().includes(searchTerm) ||
                    employee.position.toLowerCase().includes(searchTerm)
                );
            }

            if (positionFilter) {
                filteredEmployees = filteredEmployees.filter(employee =>
                    employee.position === positionFilter
                );
            }

            if (statusFilter) {
                filteredEmployees = filteredEmployees.filter(employee =>
                    employee.status === statusFilter
                );
            }

            renderEmployeesTable(filteredEmployees);
        }

        // Close modal when clicking outside
        document.getElementById('employeeModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Carregar funcionários quando a página abrir
        document.addEventListener('DOMContentLoaded', function () {
            loadEmployees();
        });
    </script>
    <script>
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                e.preventDefault();
            }
        });
    </script>
</body>

</html>
